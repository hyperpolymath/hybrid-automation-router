#
# The hosted pre-commit.ci service requires this repository-level file.
# Keep this intentionally small: no Python/Node package or compiler runtime.
ci:
  autofix_prs: false
  autoupdate_schedule: quarterly

repos:
  - repo: local
    hooks:
      - id: har-spdx-header
        name: HAR SPDX header on source and workflow files
        entry: bash hooks/check-spdx-headers.sh
        language: system
        files: '(^crates/.*\.rs$|^src/abi/.*\.(idr|eph)$|^ffi/zig/.*\.zig$|^\.github/workflows/.*\.ya?ml$)'
        types: [file]
        pass_filenames: true
