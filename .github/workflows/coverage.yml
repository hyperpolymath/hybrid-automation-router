#
# Owned coverage gate (HAR pilot of the estate next-gen testing standard).
#
# Replaces GitHub's Enterprise-only `code_coverage` ruleset rule (unavailable on
# Pro/Team) with a gate we OWN: real line coverage from cargo-llvm-cov, computed
# on our own runner, surfaced as a status check we control. This is the
# "own maximal on your own compute" route — the green comes from our verifier,
# not a rented GitHub feature.
#
# Enforcement is RATCHETED, never lowered:
#   - FLOOR starts at 0 (report-only) so we land the gate and learn the honest
#     baseline without blocking.
#   - After the first run reveals the true % we raise FLOOR to that baseline
#     (a no-regression floor), then keep raising it toward the 95% target as
#     tests are written. The number only ever goes UP.
#
# Once this reports reliably, it is promoted to a required status check in the
# Base ruleset and extracted into a `standards` coverage-reusable so every repo
# inherits it (build once, bank it, reuse).

name: Coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ratchet this upward toward 95 as coverage improves. Never lower it.
  # 2026-07-06: first measured baseline = 84.45%. Floor set at 84 (no-regression).
  FLOOR: "84"

jobs:
  coverage:
    name: llvm-cov line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Measure line coverage
        id: cov
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --locked --json --output-path cov.json
          PCT=$(jq -r '.data[0].totals.lines.percent' cov.json)
          printf '### Line coverage: %.2f%% (floor %s%%)\n' "$PCT" "$FLOOR" >> "$GITHUB_STEP_SUMMARY"
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"

      - name: Enforce ratchet floor
        run: |
          set -euo pipefail
          PCT="${{ steps.cov.outputs.pct }}"
          awk -v p="$PCT" -v f="$FLOOR" 'BEGIN {
            if (p + 0 < f + 0) { printf "FAIL: coverage %.2f%% is below floor %s%%\n", p, f; exit 1 }
            printf "OK: coverage %.2f%% >= floor %s%%\n", p, f
          }'
