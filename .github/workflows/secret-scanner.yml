# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    # NOTE: a reusable-workflow caller job may only set uses/with/secrets/etc.
    # `timeout-minutes` is NOT permitted here and makes GitHub reject the whole
    # workflow (startup_failure on every push). The timeout belongs inside the
    # reusable workflow in hyperpolymath/standards, not on the caller.
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@84355587cb2a1f86e6882de83514a32db2646e7a
    secrets: inherit
