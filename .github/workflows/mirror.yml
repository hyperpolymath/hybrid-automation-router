name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    # NOTE: a reusable-workflow caller job may only set uses/with/secrets/etc.
    # `timeout-minutes` is NOT permitted here and makes GitHub reject the whole
    # workflow (startup_failure on every push). The timeout belongs inside the
    # reusable workflow in hyperpolymath/standards, not on the caller.
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@84355587cb2a1f86e6882de83514a32db2646e7a
    secrets: inherit
