# This workflow is managed by gh actions-lock.
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'

permissions:
  actions: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # gh actions-lock prepends its own managed-file comment before
            # SPDX. Require SPDX in the *leading comment block*, before any
            # executable YAML, rather than insisting it occupy line one.
            if ! awk '
              /^[[:space:]]*#/ {
                if ($0 ~ /SPDX-License-Identifier:[[:space:]]*[^[:space:]]/) found = 1
                next
              }
              /^[[:space:]]*$/ { next }
              { exit (found ? 0 : 1) }
              END { if (!found) exit 1 }
            ' "$f"; then
              echo "ERROR: $f missing SPDX header in leading comments" >&2
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          exit $errors

      - name: Check pinned actions
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            # Look for uses: without SHA
            if grep -E "uses:.*@v[0-9]" "$f" | grep -v "#"; then
              echo "WARNING: $f has unpinned actions (missing SHA comment)"
            fi
          done
