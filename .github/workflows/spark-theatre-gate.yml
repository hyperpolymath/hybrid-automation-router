# SPDX-License-Identifier: MPL-2.0
# Estate SPARK Theatre Gate — thin caller of the reusable workflow in
# hyperpolymath/standards (#135 / #141). Pinned by commit SHA per the
# estate action-pinning policy. Regenerate the pin only when the reusable
# workflow is intentionally bumped.
name: SPARK Theatre Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  spark-theatre-gate:
    # NOTE: a reusable-workflow caller job may only set uses/with/secrets/etc.
    # `timeout-minutes` is NOT permitted here and makes GitHub reject the whole
    # workflow (startup_failure on every push). The timeout belongs inside the
    # reusable workflow in hyperpolymath/standards, not on the caller.
    uses: hyperpolymath/standards/.github/workflows/spark-theatre-gate.yml@c4d24103506d9519ef87047eaabc3d5f5efaccd0
    with:
      paths: "."
      enforce_zero_contract: false
