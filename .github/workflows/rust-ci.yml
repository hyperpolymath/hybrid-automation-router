name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@c4d24103506d9519ef87047eaabc3d5f5efaccd0
    timeout-minutes: 10
