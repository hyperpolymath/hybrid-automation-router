# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@f2f8e6791b09f1f498f01b798e4670a1ebc9c986
    # NB: no timeout-minutes / runs-on / steps here — a reusable-calling job only
    # permits uses/with/secrets/needs/if/permissions. timeout-minutes made GitHub
    # reject the whole file (0s "Unexpected value 'timeout-minutes'" startup_failure),
    # so HAR's Rust CI never ran. The reusable's own jobs set their timeouts.
