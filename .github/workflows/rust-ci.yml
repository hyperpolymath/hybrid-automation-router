# SPDX-License-Identifier: MPL-2.0
# Rust CI — thin wrapper calling the shared estate reusable in
# hyperpolymath/standards. Configure once, propagate everywhere.
# See: docs/CI-REUSABLE-WORKFLOWS.adoc in standards.
name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust-ci:
    uses: hyperpolymath/standards/.github/workflows/rust-ci-reusable.yml@13d4f2865e361a5480d8d140c4feac332d341cca
    timeout-minutes: 30
    with:
      # Owned coverage gate via the shared reusable (replaces the standalone
      # coverage.yml). Baseline was 84.45%; ratchet the floor toward 95%.
      enable_coverage: true
      coverage_floor: "84"
