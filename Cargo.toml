[workspace]
resolver = "2"
members = [
    "crates/har-core",
    "crates/har-router",
    "crates/har-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PMPL-1.0-or-later"  # MPL-2.0 fallback available for ecosystem compatibility
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/hybrid-automation-router"

[workspace.dependencies]
# Core
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async
async-trait = "0.1"
futures = "0.3"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1.19", features = ["v4", "serde"] }

# Configuration
nickel-lang-core = "0.8"
