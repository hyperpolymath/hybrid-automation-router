[package]
name = "har-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Event dispatch to automation targets — the bridge between HAR and rpa-elysium"

[dependencies]
har-core = { path = "../har-core" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
async-nats = { version = "0.49", optional = true }

[features]
# The real NATS-backed transport. Off by default so the standard build and CI
# need neither the async-nats dependency tree nor a running NATS server; live
# integration tests require `--features nats` and a reachable server (NATS_URL).
nats = ["dep:async-nats"]

[dev-dependencies]
proptest = { workspace = true }
